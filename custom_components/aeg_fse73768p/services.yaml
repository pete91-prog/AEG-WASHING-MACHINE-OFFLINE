start_program:
  name: Start programme
  description: Start a QuickSelect programme on the FSE73768P.
  fields:
    device_id:
      name: Device
      description: Leave empty if you only have one dishwasher.
      selector:
        device:
          integration: aeg_fse73768p
    program:
      name: Programme
      required: true
      example: eco
      selector:
        select:
          options:
            - quick
            - 1h
            - 1h30
            - 2h40
            - eco
            - auto_sense
            - machine_care
            - prewash
    extra_power:
      name: ExtraPower
      selector:
        boolean:
    glass_care:
      name: GlassCare
      selector:
        boolean:
    extra_silent:
      name: ExtraSilent
      selector:
        boolean:
    delay_hours:
      name: Delay start
      selector:
        number:
          min: 0
          max: 24
          unit_of_measurement: h

pause:
  name: Pause
  description: Pause a running programme.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: aeg_fse73768p

resume:
  name: Resume
  description: Resume after a pause. The door must be closed.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: aeg_fse73768p

cancel:
  name: Cancel
  description: Cancel the current programme or delayed start.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: aeg_fse73768p
